<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Ambient ground shadow -->
    <radialGradient id="d1_groundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a354d" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#2a354d" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#2a354d" stop-opacity="0" />
    </radialGradient>

    <!-- Top face watercolor pastel ivory -->
    <linearGradient id="d1_topGrad" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#fff8f2" />
      <stop offset="100%" stop-color="#f5e8dc" />
    </linearGradient>

    <!-- Left face soft sky lavender shadow -->
    <linearGradient id="d1_leftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#edf2fc" />
      <stop offset="100%" stop-color="#d2def2" />
    </linearGradient>

    <!-- Right face warm blush peach shadow -->
    <linearGradient id="d1_rightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcedeb" />
      <stop offset="100%" stop-color="#edd2ce" />
    </linearGradient>

    <!-- Center pip cherry coral red -->
    <radialGradient id="d1_pipRed" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff758f" />
      <stop offset="55%" stop-color="#ff477e" />
      <stop offset="100%" stop-color="#c9184a" />
    </radialGradient>

    <!-- Side pips pastel indigo -->
    <radialGradient id="d1_pipIndigo" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4a5f8a" />
      <stop offset="55%" stop-color="#2d3b59" />
      <stop offset="100%" stop-color="#182236" />
    </radialGradient>

    <!-- Soft bevel glow filter -->
    <filter id="d1_bevelGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#718096" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="128" cy="226" rx="84" ry="20" fill="url(#d1_groundShadow)" />

  <!-- Main 3D Cube Body with rounded bevel join -->
  <g filter="url(#d1_bevelGlow)">
    <!-- Base outer shape for seamless rounded vertices -->
    <path d="M 128,42 L 204,84 L 204,172 L 128,214 L 52,172 L 52,84 Z"
          fill="#d8e2f0" stroke="#cbd5e1" stroke-width="6" stroke-linejoin="round" />

    <!-- Left Face -->
    <path d="M 52,84 L 128,126 L 128,214 L 52,172 Z"
          fill="url(#d1_leftGrad)" stroke="#c2d0e6" stroke-width="1.5" stroke-linejoin="round" />

    <!-- Right Face -->
    <path d="M 128,126 L 204,84 L 204,172 L 128,214 Z"
          fill="url(#d1_rightGrad)" stroke="#dec2bc" stroke-width="1.5" stroke-linejoin="round" />

    <!-- Top Face -->
    <path d="M 128,42 L 204,84 L 128,126 L 52,84 Z"
          fill="url(#d1_topGrad)" stroke="#e2e8f0" stroke-width="1.5" stroke-linejoin="round" />
  </g>

  <!-- Edge seam highlights -->
  <path d="M 128,126 L 128,213" stroke="#b8c6dc" stroke-width="2.2" stroke-linecap="round" />
  <path d="M 128,126 L 53,84" stroke="#cbd7eb" stroke-width="2" stroke-linecap="round" />
  <path d="M 128,126 L 203,84" stroke="#d9c7c2" stroke-width="2" stroke-linecap="round" />
  <!-- Glossy top rim reflection -->
  <path d="M 54,84 L 128,43 L 202,84" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />

  <!-- ================= TOP FACE: PIP 1 (Cherry Coral) ================= -->
  <g id="face1_pip">
    <!-- Drop shadow for tactile embossed depth -->
    <ellipse cx="128" cy="86" rx="17" ry="9.5" fill="#c9184a" opacity="0.25" />
    <!-- Pip body -->
    <ellipse cx="128" cy="85" rx="17" ry="9.5" fill="url(#d1_pipRed)" />
    <!-- Glossy reflection specular -->
    <ellipse cx="125" cy="83" rx="5" ry="2.3" fill="#ffffff" opacity="0.8" />
    <circle cx="132" cy="86" r="1.5" fill="#ffffff" opacity="0.5" />
  </g>

  <!-- ================= LEFT FACE: 2 PIPS (Indigo) ================= -->
  <g id="left_pips" transform="translate(0, 0)">
    <!-- Pip 1 -->
    <g transform="translate(73, 134) rotate(-30)">
      <ellipse cx="0" cy="0" rx="8" ry="12" fill="url(#d1_pipIndigo)" />
      <ellipse cx="-2" cy="-3" rx="2.5" ry="3.5" fill="#ffffff" opacity="0.65" />
    </g>
    <!-- Pip 2 -->
    <g transform="translate(107, 164) rotate(-30)">
      <ellipse cx="0" cy="0" rx="8" ry="12" fill="url(#d1_pipIndigo)" />
      <ellipse cx="-2" cy="-3" rx="2.5" ry="3.5" fill="#ffffff" opacity="0.65" />
    </g>
  </g>

  <!-- ================= RIGHT FACE: 3 PIPS (Indigo) ================= -->
  <g id="right_pips">
    <!-- Pip 1 -->
    <g transform="translate(149, 134) rotate(30)">
      <ellipse cx="0" cy="0" rx="8" ry="12" fill="url(#d1_pipIndigo)" />
      <ellipse cx="-2" cy="-3" rx="2.5" ry="3.5" fill="#ffffff" opacity="0.65" />
    </g>
    <!-- Pip 2 -->
    <g transform="translate(166, 149) rotate(30)">
      <ellipse cx="0" cy="0" rx="8" ry="12" fill="url(#d1_pipIndigo)" />
      <ellipse cx="-2" cy="-3" rx="2.5" ry="3.5" fill="#ffffff" opacity="0.65" />
    </g>
    <!-- Pip 3 -->
    <g transform="translate(183, 164) rotate(30)">
      <ellipse cx="0" cy="0" rx="8" ry="12" fill="url(#d1_pipIndigo)" />
      <ellipse cx="-2" cy="-3" rx="2.5" ry="3.5" fill="#ffffff" opacity="0.65" />
    </g>
  </g>
</svg>
